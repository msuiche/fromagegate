title: Danfoss AK-SM 8xxA Web Service Triggering nginx Reload or Crash
id: cbd51e55-58ed-4f2f-9c2f-b73135256352
status: experimental
description: |
  Detects the runtime reload of the external nginx instance by the AK-SM
  web service (the mechanism that applies an uploaded headers.conf), and
  crash/restart patterns of the sm_app web task. Requests to a route
  injected via CVE-2025-41452 crash sm_app (502 followed by service-wide
  503s), so repeated sm_app restarts after an nginx reload are a strong
  post-exploitation signal.
references:
  - https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers
  - https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2025-08-01/
author: offensive-research
date: 2026-10-12
logsource:
  category: process_creation
  product: linux
detection:
  selection_reload:
    CommandLine|contains:
      - 'nginx -s reload'
      - 'nginx -s reopen'
  selection_parent:
    ParentImage|endswith:
      - '/sm_app'
      - '/sm_fcgi_app'
  condition: all of selection_*
falsepositives:
  - Legitimate configuration changes through the management interface
    trigger the same reload; alert anyway and correlate with change
    windows - the vulnerable behavior IS the web app reloading nginx
level: medium
tags:
  - attack.defense_evasion
  - attack.t1499
  - cve.2025.41452
